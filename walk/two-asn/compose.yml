# The two-ASN walk (nx-panel docs/path-telemetry.md P19 a, exit criterion 4):
# a panel, two nodes and Insight on a core network, and two client networks
# standing in for two ISPs, each with a client that keeps a VLESS
# connection a minute going through each node. A fixture network database
# maps the two client networks to AS64501 and AS64502 in Iran. run.sh builds
# the binaries into $WALK and drives it; nothing here is published but the
# panel's and Insight's ports on loopback.
name: insight-walk

x-bin: &bin
  image: alpine:3.24
  volumes:
    - ${WALK:?run.sh sets WALK}:/walk

networks:
  core: { ipam: { config: [{ subnet: 10.80.0.0/24 }] } }
  ispa: { ipam: { config: [{ subnet: 10.81.0.0/24 }] } }
  ispb: { ipam: { config: [{ subnet: 10.82.0.0/24 }] } }

services:
  # The web site the clients fetch, and the fixture network database.
  origin:
    <<: *bin
    image: busybox:latest
    command: ["httpd", "-f", "-p", "80", "-h", "/walk/www"]
    networks: { core: { ipv4_address: 10.80.0.5 } }

  panel:
    <<: *bin
    working_dir: /walk/panel
    environment:
      NX_DB_DSN: /walk/panel/nx.db
      NX_WEB_LISTEN: 0.0.0.0:2095
    command: ["sh", "-c", "/walk/bin/nx-panel migrate -user admin -pass walk-admin-1 >/dev/null && exec /walk/bin/nx-panel run"]
    ports: ["127.0.0.1:12095:2095"]
    networks:
      core: { ipv4_address: 10.80.0.10 }
      ispa: { ipv4_address: 10.81.0.10 }
      ispb: { ipv4_address: 10.82.0.10 }

  node1: &node
    <<: *bin
    cap_add: [NET_ADMIN]
    environment:
      NX_STATE_DIR: /walk/node1
    command: ["sh", "-c", "apk add -q iptables >/dev/null && exec /walk/bin/nx-node run"]
    networks:
      core: { ipv4_address: 10.80.0.21 }
      ispa: { ipv4_address: 10.81.0.21 }
      ispb: { ipv4_address: 10.82.0.21 }
  node2:
    <<: *node
    environment:
      NX_STATE_DIR: /walk/node2
    networks:
      core: { ipv4_address: 10.80.0.22 }
      ispa: { ipv4_address: 10.81.0.22 }
      ispb: { ipv4_address: 10.82.0.22 }

  insight:
    <<: *bin
    environment:
      NX_DATA_DIR: /walk/insight
      NX_MANIFEST_FILE: /walk/insight-signed.json
      NX_CLAIM_CODE: WALK-INSIGHT-0001
      NX_PANEL_URL: http://10.80.0.10:2095
      NX_OPT_PORT: "8099"
      NX_OPT_ADMIN_PASSWORD: walk-admin-1
      NX_OPT_ASN_URL: http://10.80.0.5/ip2asn.tsv.gz
      NX_OPT_CITY_URL: http://10.80.0.5/city.csv.gz
      NX_OPT_LANGUAGE: en
    command: ["/walk/bin/insight", "run"]
    ports: ["127.0.0.1:18099:8099"]
    networks: { core: { ipv4_address: 10.80.0.30 } }

  # One client per ISP: socks 1081 goes through node 1, 1082 through node 2.
  clienta: &client
    image: ghcr.io/sagernet/sing-box:latest
    command: ["run", "-c", "/walk/client-a.json"]
    volumes: ["${WALK}:/walk"]
    networks: { ispa: { ipv4_address: 10.81.0.50 } }
  clientb:
    <<: *client
    command: ["run", "-c", "/walk/client-b.json"]
    networks: { ispb: { ipv4_address: 10.82.0.50 } }

  # The traffic: a request through each node every few seconds, from inside
  # each client's network namespace. A request gives up after four seconds,
  # as an app does, so a session that carries nothing ends within the five
  # seconds under which the node counts it as cut early.
  traffica: &traffic
    image: curlimages/curl:latest
    network_mode: "service:clienta"
    entrypoint: ["sh", "-c"]
    command:
      - 'while true; do for p in 1081 1082; do curl -s -o /dev/null -m 4 -x socks5h://127.0.0.1:$$p http://10.80.0.5/index.html; done; sleep 5; done'
  trafficb:
    <<: *traffic
    network_mode: "service:clientb"
