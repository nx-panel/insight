# Insight's local stack, beside the panel's: built from this checkout, its
# data in ./data. An install uses deploy/compose.yml and the published image.
#
#   cp .env.example .env            # once: the first admin's password, the claim code
#   scripts/sign.sh -dev            # signed.json: the manifest with the development key
#   docker compose up -d --build    # again after every change
#
# The development key is trusted only by a panel built with -tags addondev.
# Insight's admin: http://localhost:8099. Registered from the local panel as
# http://host.docker.internal:8099 with the claim code in .env.
services:
  insight:
    build:
      context: .
      args:
        VITE_PRIMEUI_LICENSE: ${VITE_PRIMEUI_LICENSE:-}
    container_name: insight
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      NX_OPT_PORT: "8099"
      NX_MANIFEST_FILE: /run/nx/manifest.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8099:8099"
    volumes:
      - ./data:/data
      - ./signed.json:/run/nx/manifest.json:ro
